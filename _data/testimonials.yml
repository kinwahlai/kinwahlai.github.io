- name: Kate Siberry
  testimonial: |
    Taking part in coaching sessions with Darren has been a really positive experience for me. Going into the my first session, my expectations were for there to be a lot of talking and I wasn't sure what tools or learnings I would come away with.
    My actual experience has deepened my understanding of this type of coaching practice. Each session is focused on a lesson with simple concepts and take aways, short readings and discussion. It is not all talking, so if there are others thinking the same as me you shouldn't shy away.  The self practice wasn't time consuming and never felt like pressure and for that reason, I've absorbed so much more. 
    The benefits for me, have been that I've learnt to quicken my ability to relax, share with a group, speak my mind more feely and think about my own self development personally and professionally.
    Darren's style is very relaxed, he does a lot of grounding work at the start and end of a session to make individual and group sessions feel safe and non judgemental. Darren doesn't push but frees up space to think, silences are not awkward with this approach.
    I would recommend Darren's coaching to anyone, no matter what they they would like to get from the sessions, as you will come away with something, a toolkit for you.

- name: Narat Suchartsunthorn
  testimonial: |
    The experiences I had with Darren's coaching were unique and eye-opening. At the point when I began attending his course, I was skeptical about how much growth and understanding to myself I could have. Darren slowly and patiently guided me throughout many lessons we had, making me be more aware about myself, being no stranger to my feelings and thoughts, making me realizing my choices to use many of my abilities, and how much potential I have to grow. I feel like becoming knowledgeable to my own self more than ever before.
    I would definitely recommend Darren's coaching to anyone who is looking to gain a deeper understanding of themselves. His sessions are insightful and can help you achieve your personal and professional growth.

- name: John Stamp
  testimonial: |
    I have been coaching with Darren for the past 10 weeks. Initially, I was not sure what to expect. I agreed to it with the hope of learning something about myself and possibly getting some new skills. During the coaching and weekly checkins, I learned why certain feelings come up in my day-to-day life, discussed them, and explored tools to handle these emotions better. 
    Darren has a very gentle and understanding style. He leads you through the different processes, exploring different parts of the Satir coaching methods. It is a very easy going session. Give it a try; you won't regret it.

- name: Gavin Yang
  testimonial: |
    Darren made a great coaching process. I hoped to understand myself and handle relationships better, and it did go with that. 
    I've learned to appreciate and love myself more, and to figure out underlying emotion/yarning during a conflict. 
    This really helps me with relationships. Darren's coaching sessions are tailored accordingly with participants' feelings and talkings. 
    With this, I felt more comfortable to share. I appreciate the involvement of other participants. 
    They are sincere and willing to share, which energise the coaching sessions. It was definitely a nice experience.

- name: Poonam Khureja
  testimonial: |
    Initially I expected that in this coaching I will learn something to know myself better, which will make my life easy. 
    But this coaching was more than that. It helped not just to understand myself but others also, understanding how things have impact on our behaviour. 
    How to treat people of different nature. Over all I feel very positive, calm and composed after this coaching.
    Darren way of teaching is really good and personalised. He gave proper attention to all my doubts and puzzles. He helped me to understand all my puzzles and taught me how can I handle them.
    I would recommend others also to take these coaching classes and make their way of living life easy with positive thinking.