<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
  <link rel="stylesheet" href="{{site.baseurl}}/assets/css/main.css">
  <style>
    body { 
      margin: 0; 
      padding: 0;
      background: transparent;
      font-size: 16px; /* Override the likely large font size from main theme */
    }
    
    form {
      margin: 1em 0;
    }
    
    /* Use native CSS Grid instead of flex for more reliable layout */
    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5em;
      margin-bottom: 1.5em;
    }
    
    @media screen and (min-width: 768px) {
      .form-row.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    /* Ensure inputs are styled properly */
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5em;
      margin: 0;
    }
    
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    
    .footer-note {
      font-size: 0.6em;
      color: #666;
      margin-bottom: 1.5em;
    }
  </style>
</head>
<body>
  <form method="post" action="{{- site.form_url -}}">
    <div class="form-row two-col">
      <div>
        <input type="text" name="name" placeholder="Name" required />
      </div>
      <div>
        <input type="email" name="email" placeholder="Email" required />
      </div>
    </div>
    <div class="form-row">
      <div>
        <textarea name="message" placeholder="Message" required></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="footer-note">
        Powered by <a href="https://formspree.io" target="_blank">Formspree</a>
      </div>
    </div>
    <div class="form-row">
      <div>
        <input type="submit" value="Send Message" class="button" />
      </div>
    </div>
  </form>
</body>
</html>
