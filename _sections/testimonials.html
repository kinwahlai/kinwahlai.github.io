---
title: Testimonials
icon: fa-comment
auto-header: What Clients Say
order: 4
---
{% assign samples = site.data.testimonials | sample: 3 %}

<div class="row">
  {% for testimonial in samples %}
    <div class="col-12-mobile">
      <div class="testimonial-card">
        <h3 class="testimonial-author">{{ testimonial.name }}</h3>
        <p class="testimonial-text">"{{ testimonial.testimonial }}"</p>
      </div>
    </div>
  {% endfor %}
</div>
